<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clock</title>
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:700" rel="stylesheet">
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
        }

        #clock_holder {
            height: 100%;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #clock {
            font-size: min(13em, 18vw);
            font-family: 'Open Sans', sans-serif;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.65);
            text-shadow: 0 0 50px rgba(0, 0, 0, 0.6);
            white-space: nowrap;
        }
    </style>
</head>

<body>
    <div id="clock_holder">
        <div id="clock">
            <span id="hours">00</span>:<span id="mins">00</span>:<span id="secs">00</span>
        </div>
    </div>

    <script>
        const pad2 = (n) => String(n).padStart(2, '0');
        const toColor = (n) => Math.round(n * 255);

        const hoursEl = document.getElementById('hours');
        const minsEl = document.getElementById('mins');
        const secsEl = document.getElementById('secs');

        function updateClock() {
            const date = new Date();
            const hours = date.getHours();
            const mins = date.getMinutes();
            const secs = date.getSeconds();

            const r = toColor(hours / 23);
            const g = toColor(mins / 59);
            const b = toColor(secs / 59);

            document.body.style.background = `radial-gradient(rgb(${r},${g},${b}), black 170%)`;

            hoursEl.textContent = pad2(hours);
            minsEl.textContent = pad2(mins);
            secsEl.textContent = pad2(secs);

            setTimeout(updateClock, 1000 - date.getMilliseconds());
        }

        updateClock();
    </script>
</body>

</html>
